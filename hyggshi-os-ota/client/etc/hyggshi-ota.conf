# /etc/hyggshi-ota.conf
# Hyggshi OS OTA Update Client Configuration

# Remote OTA Repository URL (HTTPS or local file path)
OTA_REPO_URL="https://raw.githubusercontent.com/Hyggshi-OS-Research-Technology/Hyggshi-OS-Releases/main/hyggshi-os-ota"

# Update release channel: stable | beta | testing
CHANNEL="stable"

# Automatically run APT system upgrade during OTA update (true/false)
RUN_APT_UPGRADE="true"

# Path to OS release definition file
RELEASE_FILE="/etc/hyggshi-release"

# Path to OTA update log file
LOG_FILE="/var/log/hyggshi-ota.log"

# Enable GPG signature verification (true/false)
VERIFY_GPG="false"
