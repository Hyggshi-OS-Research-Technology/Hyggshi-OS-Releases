; Hyggshi Configuration Language (HCL)

; only update system

;==========Start of base==========
[my-version-os-base]
Version = 1.4.1
name = "Hyggshi OS ${Version} ${codename} Debian Edition"
codename = "Verdant Valley"
;==========END OF BASE==========


;==========Start of OTA==========
[ota]

enabled = true
channel = "stable"

metadata-url = "https://raw.githubusercontent.com/Hyggshi-OS-Research-Technology/Hyggshi-OS-Releases/main/hyggshi-os-ota/metadata/stable.json"

update-system = true
update-apps = false

preserve-home = true
preserve-user-data = true

check-disk-space = true
check-network = true
check-power = true

require-confirmation = true
auto-reboot = false

rollback-enabled = true
log-file = "/var/log/hyggshi-ota.log"

;==========END OF OTA==========


;==========Start of Desktop Environment==========
[Desktop-Environment]
; Tự động phát hiện Desktop Environment đang sử dụng (xfce, gnome, kde, cinnamon, mate, lxqt, cli)
auto-detect = true
; DE mục tiêu: "auto" (sử dụng DE được detect) hoặc chỉ định cố định một DE (xfce, gnome, kde...)
target = "auto"

; Danh sách các Desktop Environment được hỗ trợ:
xfce = true
gnome = true
kde = true
cinnamon = true
mate = true
lxqt = true
cli = true
;==========END OF DESKTOP ENVIRONMENT==========


;==========Start of package==========
[package]

;==========
; compilers and tools
;==========
python = true
jq = true
wget = true
curl = true

;==========
; App Hyggshi OS Ecosystem
;==========
nexcode-install-web = install-web(
de = "all"
run = "wget https://github.com/Hyggshi-OS-project-center/NexCode/releases/download/v4.0.2/nexcode-ide-4.0.2-amd64.deb"
run = "sudo apt install -y ./nexcode-ide-4.0.2-amd64.deb"
)

;==========
; install flatpak and flathub
;==========
flatpak1 = command(
de = "all"
run = "sudo ln -s /proc/mounts /etc/mtab"
)

flatpak2 = command(
de = "all"
run = "sudo rm -rf /var/tmp/flatpak-cache-*"
)

;==========Remove package and image / Multi-DE Wallpapers==========
; 1. Thiết lập hình nền chung Hyggshi OS cho toàn hệ thống (mọi DE)
image-background-universal = command(
de = "all"
download = "https://raw.githubusercontent.com/Hyggshi-OS-Research-Technology/Hyggshi-OS/38c4c3d47efca20f7872467f933c40820c331a4d/iso-config/branding/xfce-x.svg"
run = "sudo mkdir -p /usr/share/backgrounds/hyggshi && sudo cp -f ~/Downloads/xfce-x.svg /usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg"
)

; 2. Cấu hình hình nền khi chạy trên XFCE Desktop
image-background-xfce = command(
de = "xfce"
run = "sudo mkdir -p /usr/share/backgrounds/xfce && sudo cp -f /usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg /usr/share/backgrounds/xfce/xfce-x.svg"
)

; 3. Cấu hình hình nền khi chạy trên GNOME Desktop
image-background-gnome = command(
de = "gnome"
run = "sudo mkdir -p /usr/share/backgrounds/gnome && sudo cp -f /usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg /usr/share/backgrounds/gnome/hyggshi-wallpaper.svg"
run = "sudo mkdir -p /etc/dconf/db/local.d && printf '[org/gnome/desktop/background]\npicture-uri=\"file:///usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg\"\npicture-uri-dark=\"file:///usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg\"\npicture-options=\"zoom\"\n' | sudo tee /etc/dconf/db/local.d/00-hyggshi-wallpaper >/dev/null && sudo dconf update 2>/dev/null || true"
)

; 4. Cấu hình hình nền khi chạy trên KDE Plasma Desktop
image-background-kde = command(
de = "kde"
run = "sudo mkdir -p /usr/share/wallpapers/Hyggshi/contents/images && sudo cp -f /usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg /usr/share/wallpapers/Hyggshi/contents/images/1920x1080.svg"
)

; 5. Cấu hình hình nền khi chạy trên Cinnamon Desktop
image-background-cinnamon = command(
de = "cinnamon"
run = "sudo mkdir -p /usr/share/backgrounds/cinnamon && sudo cp -f /usr/share/backgrounds/hyggshi/hyggshi-wallpaper.svg /usr/share/backgrounds/cinnamon/hyggshi-wallpaper.svg"
)

;==========END OF REMOVE PACKAGE AND IMAGE==========


;==========Start of customization==========
[customization]

;==========
; customization for LightDM Greeter GTK theme (áp dụng cho XFCE / MATE / Cinnamon dùng LightDM)
;==========
greeter-gtk-theme = copy(
de = "xfce,mate,cinnamon"
source = "./resources/gtk.css"
rename = "gtk.css"
target = "/usr/share/themes/Hyggshi-Greeter/gtk-3.0/"
)

;==========END OF CUSTOMIZATION==========


;==========Start of compilers==========
[compilers]

; Build và cài đặt Hyggshi Sound Shortcut (chỉ dành riêng cho XFCE)
linkhyggshi-sound-shortcut = command(
de = "xfce"
file = "./resources/hyggshi-extensions-sound-shortcut/sound-shortcut.sh"
action = run
)

; Build và cài đặt Hyggshi Welcome (hỗ trợ toàn bộ Desktop Environments)
linkhyggshi-welcome = command(
de = "all"
file = "./resources/hyggshi-extensions-welcome/welcome.sh"
action = run
)

;==========END OF COMPILERS==========